<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="Todo.css">
</head>
<body>
  <main class="card">
    <h1>Todo App</h1>

    <form id="todo-form" class="add-row" autocomplete="off">
      <input id="todo-input" type="text" placeholder="What needs doing?" aria-label="New todo" maxlength="120">
      <button type="submit" class="btn-add">Add</button>
    </form>

    <div class="toolbar">
      <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>
      <div id="filters" class="filters" role="group" aria-label="Filter todos">
        <button type="button" class="filter active" data-filter="all">All</button>
        <button type="button" class="filter" data-filter="active">Active</button>
        <button type="button" class="filter" data-filter="completed">Completed</button>
      </div>
    </div>

    <!-- Rows are generated by lab3.js; ONE listener on this <ul> handles every row -->
    <ul id="todo-list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="footer">
      <span id="count">0 items left</span>
      <span id="saved" class="saved" aria-live="polite">Saved</span>
      <div class="footer-actions">
        <button type="button" id="clear-completed" class="btn-small">Clear completed</button>
        <button type="button" id="clear-all" class="btn-small">Clear all</button>
      </div>
    </footer>
  </main>

  <script src="Todo.js"></script>
</body>
</html>
